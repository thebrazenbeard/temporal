name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject hidden workspace startup execution
        run: python3 -m unittest discover -s tests -p test_workspace_startup_safety.py -v
  temporal-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify event integrity and cross-process serialization
        run: python -m unittest discover -s tests -v
