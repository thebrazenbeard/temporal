name: Temporal Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full unittest suite
        run: python -B -m unittest discover -s tests -v
